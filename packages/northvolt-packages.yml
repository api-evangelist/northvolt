note: >-
  NONE OF THESE ARE API SDKs. Northvolt publishes no public API, so there is no client
  library for one. What the github.com/northvolt organization does publish is a small set
  of first-party Go modules written for its own factory floor -- drivers and wrappers for
  industrial cameras, frame grabbers, contact image sensors and a crypto element. They are
  real, registry-resolvable, first-party and dated, so they are recorded here as packages;
  no `SDKs` pointer is wired into apis.yml, because wiring one would credit Northvolt with
  an API client library it never shipped. Every module's last published release predates
  the March 2025 bankruptcy by 18 months or more.
