aid: northvolt
name: Northvolt
description: 'Northvolt AB is a Swedish lithium-ion battery developer and manufacturer,
  founded in Stockholm in 2016, that built and operated the Northvolt Ett gigafactory
  in Skelleftea and the Northvolt Labs R&D and qualification campus in Vasteras, with
  further sites in Heide (Germany), Gdansk (Poland) and Montreal (Canada). Its product
  line covered lithium-ion, sodium-ion and lithium-metal cells, the Voltpack Core and
  Voltpack Mobile System battery energy storage systems, the Revolt battery recycling
  operation, and a Connected Battery telemetry and fleet-management service. Northvolt
  AB filed for bankruptcy in Sweden on 12 March 2025; through 2025 its remaining assets
  in Sweden, Germany and Poland were acquired by Lyten. The company never published a
  public developer program, API reference or machine-readable API contract; its only
  named developer-facing surface, api.northvolt.com, no longer has a reachable origin.'
